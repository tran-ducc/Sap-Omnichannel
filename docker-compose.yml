services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: omni_dev_password
      POSTGRES_DB: omni_retail
    ports:
      - "5432:5432"
    volumes:
      # Named explicitly: an older "omnichannel-retail_pgdata" volume with other
      # credentials already existed on the dev machine and is left untouched.
      - omni_retail_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  omni_retail_pg:
